<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
// ===== 상수 =====
const VW=844,VH=390,TAU=Math.PI*2,STEP=1/60,SNAP_MS=50,IN_MS=33,INTERP=100;
const AR={x0:14,y0:48,x1:830,y1:382};
const PILLARS=[{x:422,y:215,r:34},{x:262,y:126,r:22},{x:582,y:304,r:22},{x:262,y:304,r:22},{x:582,y:126,r:22}];
const SPAWNS=[{x:90,y:215,f:0},{x:754,y:215,f:Math.PI},{x:422,y:76,f:Math.PI/2}];
const WINS_NEEDED=2,ROUND_TIME=100;
const PREFIX='neonpvp-gkc7-',ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]};
const CLS={
  warrior:{name:'전사',icon:'⚔',tag:'근접 · 단단함',hp:800,spd:125,r:16,aim:320,
    atk:{dmg:16,cd:0.6,range:68,arc:2.1},
    s1:{name:'휩쓸기 돌진',short:'돌진',cd:5,dmg:26,dist:210,dur:0.22},
    s2:{name:'반격 자세',short:'반격',cd:7,dur:1.0,dmg:40,whiff:0.5}},
  archer:{name:'궁수',icon:'🏹',tag:'원거리 · 날렵함',hp:550,spd:170,r:14,aim:520,
    atk:{dmg:10,cd:0.5,range:500,spd:640},
    s1:{name:'거대 화살',short:'거대',cd:6,charge:0.55,slow:0.3,dmg:40,spd:820,range:720},
    s2:{name:'후방 도약',short:'도약',cd:6,dist:180,dur:0.28,root:1.0,dmg:8,trapLife:8}},
  mage:{name:'마법사',icon:'🔥',tag:'광역 · 회복',hp:600,spd:160,r:15,aim:420,
    atk:{dmg:18,cd:0.7,range:400,spd:380,rad:40},
    s1:{name:'반자폭',short:'폭발',cd:7,dmg:14,rad:130,push:20,warn:0.25},
    s2:{name:'회복',short:'회복',cd:10,dur:1.0,heal:110}}
};
const ME='#22f6ff',EN=['#ff3b5c','#ff9a2a'],ENATK='#ff7a2a';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,hyp=Math.hypot;
function angD(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
const lerpA=(a,b,f)=>a+angD(b,a)*f;
const NOIN={mx:0,my:0,a:false,s1n:0,s2n:0};

// ===== 시뮬레이션 (방장/연습에서만 실행) =====
function segBlocked(x1,y1,x2,y2,pad){for(const q of PILLARS){const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;let t=L?((q.x-x1)*dx+(q.y-y1)*dy)/L:0;t=clamp(t,0,1);if(hyp(x1+dx*t-q.x,y1+dy*t-q.y)<q.r+pad)return true;}return false;}
function collide(p){for(const q of PILLARS){const dx=p.x-q.x,dy=p.y-q.y,d=hyp(dx,dy)||.01,m=q.r+p.r;if(d<m){p.x=q.x+dx/d*m;p.y=q.y+dy/d*m;}}p.x=clamp(p.x,AR.x0+p.r,AR.x1-p.r);p.y=clamp(p.y,AR.y0+p.r,AR.y1-p.r);}
function newPlayer(cls,i){const C=CLS[cls],s=SPAWNS[i];return{i,cls,r:C.r,x:s.x,y:s.y,face:s.f,hp:C.hp,mhp:C.hp,cd:[0,0,0],act:null,root:0,fl:0,inv:0,alive:true,s1n:0,s2n:0};}
function newMatch(clsArr){const S={ph:'count',ct:1.8,rd:1,time:0,wins:clsArr.map(()=>0),winner:-1,rw:-1,P:clsArr.map((c,i)=>newPlayer(c,i)),J:[],T:[],fx:[{k:'rstart',rd:1}],nid:1,lens:[]};return S;}
function resetRound(S){S.P=S.P.map((p,i)=>{const n=newPlayer(p.cls,i);n.s1n=p.s1n;n.s2n=p.s2n;return n;});S.J=[];S.T=[];S.ph='count';S.ct=1.8;S.time=0;S.rw=-1;S.fx.push({k:'rstart',rd:S.rd});}
function nearestEnemy(S,i){const p=S.P[i];let b=null;for(const e of S.P){if(e.i===i||!e.alive)continue;const d=hyp(e.x-p.x,e.y-p.y);if(!b||d<b.d)b={e,d};}return b;}
function step(S,inputs,dt){
  if(S.ph==='over')return;
  if(S.ph!=='play'){
    for(const p of S.P){const n=inputs[p.i]||NOIN;p.s1n=n.s1n;p.s2n=n.s2n;}
    S.ct-=dt;
    if(S.ct<=0){
      if(S.ph==='count'){S.ph='play';S.fx.push({k:'go'});}
      else if(S.winner>=0){S.ph='over';S.fx.push({k:'over',w:S.winner});}
      else{S.rd++;resetRound(S);}
    }
    return;
  }
  S.time+=dt;
  S.tick=(S.tick||0)+1;const ord=S.tick&1?S.P.slice().reverse():S.P;for(const p of ord)updPlayer(S,p,inputs[p.i]||NOIN,dt);
  for(let a=0;a<S.P.length;a++)for(let b=a+1;b<S.P.length;b++){const p=S.P[a],q=S.P[b];if(!p.alive||!q.alive)continue;const dx=q.x-p.x,dy=q.y-p.y,d=hyp(dx,dy)||.01,m=p.r+q.r;if(d<m){const k=(m-d)/2;p.x-=dx/d*k;p.y-=dy/d*k;q.x+=dx/d*k;q.y+=dy/d*k;collide(p);collide(q);}}
  updProj(S,dt);updTraps(S,dt);
  const alive=S.P.filter(p=>p.alive);
  let end=alive.length<=1,w=alive.length===1?alive[0].i:-1;
  if(!end&&S.time>=ROUND_TIME){end=true;let bv=-1,tie=false;w=-1;for(const p of alive){const v=p.hp/p.mhp;if(v>bv+1e-6){bv=v;w=p.i;tie=false;}else if(Math.abs(v-bv)<1e-6)tie=true;}if(tie)w=-1;}
  if(end){S.ph='rend';S.ct=2.4;S.rw=w;S.lens.push(S.time);if(w>=0){S.wins[w]++;if(S.wins[w]>=WINS_NEEDED)S.winner=w;}S.fx.push({k:'rend',w});}
}
function updPlayer(S,p,inp,dt){
  const C=CLS[p.cls];
  const s1=inp.s1n!==p.s1n,s2=inp.s2n!==p.s2n;p.s1n=inp.s1n;p.s2n=inp.s2n;
  if(!p.alive)return;
  for(let k=0;k<3;k++)p.cd[k]=Math.max(0,p.cd[k]-dt);
  p.root=Math.max(0,p.root-dt);p.fl=Math.max(0,p.fl-dt);p.inv=Math.max(0,p.inv-dt);
  if(p.kb&&p.kb.t>0){p.kb.t-=dt;p.x+=p.kb.vx*dt;p.y+=p.kb.vy*dt;collide(p);}
  let mx=+inp.mx||0,my=+inp.my||0;const ml=hyp(mx,my);if(ml>1){mx/=ml;my/=ml;}
  const ne=nearestEnemy(S,p.i);
  let aim=p.face;
  if(ne&&ne.d<=C.aim)aim=Math.atan2(ne.e.y-p.y,ne.e.x-p.x);else if(ml>.2)aim=Math.atan2(my,mx);
  const a=p.act;
  if(a){
    a.t-=dt;
    if(a.k==='heal'){p.hp=Math.min(p.mhp,p.hp+C.s2.heal/C.s2.dur*dt);if(a.t<=0)p.act=null;}
    else if(a.k==='blast'){if(a.t<=0){p.act=null;S.fx.push({k:'nova',x:p.x,y:p.y,o:p.i});
        for(const e of S.P){if(e.i===p.i||!e.alive)continue;const d=hyp(e.x-p.x,e.y-p.y);if(d<=C.s1.rad+e.r&&damage(S,e,C.s1.dmg,p.i)){const v=C.s1.push/.15;e.kb={vx:(e.x-p.x)/(d||1)*v,vy:(e.y-p.y)/(d||1)*v,t:.15};}}}}
    else if(a.k==='dash'||a.k==='leap'){
      p.x+=a.dx*a.v*dt;p.y+=a.dy*a.v*dt;collide(p);
      if(a.k==='dash')for(const e of S.P){if(e.i===p.i||!e.alive||a.hit.includes(e.i))continue;if(hyp(e.x-p.x,e.y-p.y)<p.r+e.r+12){a.hit.push(e.i);S.fx.push({k:'slash',x:e.x,y:e.y,o:p.i});damage(S,e,C.s1.dmg,p.i);}}
      if(p.act===a&&a.t<=0)p.act=null;
    }else if(a.k==='counter'){if(a.t<=0){p.act={k:'whiff',t:C.s2.whiff};S.fx.push({k:'whiff',x:p.x,y:p.y});}}
    else if(a.k==='whiff'){if(a.t<=0)p.act=null;}
    else if(a.k==='charge'){a.a=aim;p.face=aim;if(a.t<=0){p.act=null;spawnProj(S,p,'big',aim);p.cd[0]=Math.max(p.cd[0],.25);}}
  }
  const ak=p.act&&p.act.k;
  if(!ak||ak==='charge'){
    if(p.root<=0&&ml>.05){const sp=C.spd*(ak==='charge'?C.s1.slow:1);p.x+=mx*sp*dt;p.y+=my*sp*dt;collide(p);}
    if(!ak)p.face=aim;
  }
  if(!p.act){
    if(s1&&p.cd[1]<=0&&(p.root<=0||p.cls==='mage')){
      p.cd[1]=C.s1.cd;
      if(p.cls==='warrior'){p.act={k:'dash',t:C.s1.dur,v:C.s1.dist/C.s1.dur,dx:Math.cos(aim),dy:Math.sin(aim),hit:[]};S.fx.push({k:'dash',x:p.x,y:p.y,o:p.i});}
      else if(p.cls==='mage'){p.act={k:'blast',t:C.s1.warn};S.fx.push({k:'blastw',x:p.x,y:p.y,o:p.i});}
      else{p.act={k:'charge',t:C.s1.charge,a:aim};S.fx.push({k:'charge',x:p.x,y:p.y,o:p.i});}
    }else if(s2&&p.cd[2]<=0&&(p.cls!=='archer'||p.root<=0)){
      p.cd[2]=C.s2.cd;
      if(p.cls==='warrior'){p.act={k:'counter',t:C.s2.dur};S.fx.push({k:'stance',x:p.x,y:p.y,o:p.i});}
      else if(p.cls==='mage'){p.act={k:'heal',t:C.s2.dur};S.fx.push({k:'heal',x:p.x,y:p.y,o:p.i});}
      else{
        S.T.push({id:S.nid++,o:p.i,x:p.x,y:p.y,arm:.35,life:C.s2.trapLife});
        const mine=S.T.filter(t=>t.o===p.i);if(mine.length>2)S.T.splice(S.T.indexOf(mine[0]),1);
        const b=aim+Math.PI;p.act={k:'leap',t:C.s2.dur,v:C.s2.dist/C.s2.dur,dx:Math.cos(b),dy:Math.sin(b)};S.fx.push({k:'leap',x:p.x,y:p.y,o:p.i});
      }
    }
  }
  if(!p.act&&inp.a&&p.cd[0]<=0){
    p.cd[0]=C.atk.cd;
    if(p.cls==='warrior'){
      S.fx.push({k:'swing',x:p.x,y:p.y,a:aim,o:p.i,rng:C.atk.range,arc:C.atk.arc});
      for(const e of S.P){if(e.i===p.i||!e.alive)continue;const d=hyp(e.x-p.x,e.y-p.y);if(d<=C.atk.range+e.r&&Math.abs(angD(Math.atan2(e.y-p.y,e.x-p.x),aim))<=C.atk.arc/2)damage(S,e,C.atk.dmg,p.i);}
    }else spawnProj(S,p,p.cls==='mage'?'fire':'arrow',aim);
  }
}
function spawnProj(S,p,k,ang){
  const C=CLS[p.cls];let d;
  if(k==='arrow')d={sp:C.atk.spd,r:4,dmg:C.atk.dmg,rng:C.atk.range,pierce:false};
  else if(k==='fire')d={sp:C.atk.spd,r:7,dmg:C.atk.dmg,rng:C.atk.range,pierce:false};
  else if(k==='big')d={sp:C.s1.spd,r:13,dmg:C.s1.dmg,rng:C.s1.range,pierce:true};
  else d={sp:760,r:20,dmg:C.s2.dmg,rng:460,pierce:false};
  const cx=Math.cos(ang),sy=Math.sin(ang);
  S.J.push({id:S.nid++,k,o:p.i,x:p.x+cx*(p.r+2),y:p.y+sy*(p.r+2),vx:cx*d.sp,vy:sy*d.sp,r:d.r,dmg:d.dmg,life:d.rng,sp:d.sp,pierce:d.pierce,hit:[]});
  S.fx.push({k:'shot',s:k,x:p.x,y:p.y,o:p.i});
}
function damage(S,v,amt,oi,noCounter){
  if(!v.alive||v.inv>0)return false;
  if(!noCounter&&v.act&&v.act.k==='counter'){
    v.act=null;v.inv=.35;const src=S.P[oi];
    const ang=src?Math.atan2(src.y-v.y,src.x-v.x):v.face;v.face=ang;
    spawnProj(S,v,'wave',ang);S.fx.push({k:'block',x:v.x,y:v.y,o:v.i});return false;
  }
  v.hp-=amt;v.fl=.15;S.fx.push({k:'hit',x:v.x,y:v.y,v:v.i,n:amt});
  if(v.act&&v.act.k==='heal'){v.act=null;S.fx.push({k:'healx',x:v.x,y:v.y});}
  if(v.hp<=0){v.hp=0;v.alive=false;v.act=null;S.fx.push({k:'ko',x:v.x,y:v.y,v:v.i});}
  return true;
}
function updProj(S,dt){
  for(let n=S.J.length-1;n>=0;n--){
    const j=S.J[n];j.x+=j.vx*dt;j.y+=j.vy*dt;j.life-=j.sp*dt;let dead=j.life<=0;const fire=j.k==='fire';
    if(j.x<AR.x0||j.x>AR.x1||j.y<AR.y0||j.y>AR.y1){dead=true;S.fx.push({k:'spark',x:clamp(j.x,AR.x0,AR.x1),y:clamp(j.y,AR.y0,AR.y1),o:j.o});}
    if(!dead)for(const q of PILLARS)if(hyp(j.x-q.x,j.y-q.y)<q.r+j.r*.4){dead=true;S.fx.push({k:'spark',x:j.x,y:j.y,o:j.o});break;}
    if(!dead&&fire){for(const e of S.P){if(e.i!==j.o&&e.alive&&hyp(e.x-j.x,e.y-j.y)<e.r+j.r){dead=true;break;}}}
    if(fire&&dead){j.x=clamp(j.x,AR.x0,AR.x1);j.y=clamp(j.y,AR.y0,AR.y1);explode(S,j);}
    else if(!dead)for(const e of S.P){if(e.i===j.o||!e.alive||j.hit.includes(e.i))continue;if(hyp(e.x-j.x,e.y-j.y)<e.r+j.r){j.hit.push(e.i);const ok=damage(S,e,j.dmg,j.o);if(!ok||!j.pierce){dead=true;break;}}}
    if(dead)S.J.splice(n,1);
  }
}

function newBrain(){return{sx:Math.random()<.5?1:-1,st:0,dec:0,o:{mx:0,my:0,a:false,s1n:0,s2n:0}};}
function botThink(S,i,B,dt){
  const o=B.o,p=S.P[i];o.a=false;
  if(!p||!p.alive||S.ph!=='play'){o.mx=o.my=0;return o;}
  const ne=nearestEnemy(S,i);if(!ne){o.mx=o.my=0;return o;}
  const e=ne.e,d=Math.max(1,ne.d),ux=(e.x-p.x)/d,uy=(e.y-p.y)/d,C=CLS[p.cls];
  const los=!segBlocked(p.x,p.y,e.x,e.y,3),ek=e.act&&e.act.k;
  B.st-=dt;if(B.st<=0){B.sx=-B.sx;B.st=.5+Math.random()*1.1;}
  B.dec-=dt;const dec=B.dec<=0;if(dec){B.dec=.1+Math.random()*.12;B.dodge=Math.random()<(p.cls==='warrior'?.5:.35);}
  let th=null;
  for(const j of S.J){if(j.o===i)continue;const rx=p.x-j.x,ry=p.y-j.y,vv=j.vx*j.vx+j.vy*j.vy;if(!vv)continue;const tc=(rx*j.vx+ry*j.vy)/vv;if(tc<0||tc>.45)continue;if(hyp(j.x+j.vx*tc-p.x,j.y+j.vy*tc-p.y)<p.r+j.r+8+(j.k==='fire'?24:0)&&(!th||tc<th.tc))th={j,tc};}
  if(!B.dodge&&th&&(th.j.k==='arrow'||th.j.k==='fire'))th=null;
  let mx=0,my=0;
  if(p.cls==='warrior'){
    mx=ux;my=uy;if(d>100){mx+=-uy*B.sx*.6;my+=ux*B.sx*.6;}
    if(dec){
      if(p.cd[2]<=0&&((th&&(th.j.k!=='arrow'||Math.random()<.3))||(ek==='charge'&&e.act.t<.3&&los&&Math.random()<.7)||(ek==='dash'&&d<160&&Math.random()<.5)||(ek==='blast'&&d<CLS.mage.s1.rad+p.r&&Math.random()<.3)))o.s2n++;
      else if(p.cd[1]<=0&&los&&d>80&&d<C.s1.dist+10&&ek!=='counter'&&Math.random()<.7)o.s1n++;
    }
    if(ek==='blast'&&B.dodge&&d<CLS.mage.s1.rad+p.r+10){mx=-ux*2;my=-uy*2;}
    if(th&&p.cd[2]>0){const l=hyp(th.j.vx,th.j.vy);mx+=-th.j.vy/l*B.sx*1.2;my+=th.j.vx/l*B.sx*1.2;}
    o.a=d<C.atk.range+e.r+4&&!(ek==='counter'&&Math.random()<.85);
  }else{
    const MG=p.cls==='mage',want=MG?(e.cls==='warrior'?260:e.cls==='archer'?320:300):(e.cls==='warrior'?300:e.cls==='mage'?360:270);let best=-1e9;
    for(let k=0;k<16;k++){const an=k*TAU/16,dx=Math.cos(an),dy=Math.sin(an),fx=p.x+dx*70,fy=p.y+dy*70;
      let sc=-Math.abs(hyp(fx-e.x,fy-e.y)-want)*1.2+(dx*-uy+dy*ux)*B.sx*25;
      const wm=Math.min(fx-AR.x0,AR.x1-fx,fy-AR.y0,AR.y1-fy);if(wm<70)sc-=(70-wm)*3;
      for(const q of PILLARS){const g=hyp(fx-q.x,fy-q.y)-q.r-p.r;if(g<20)sc-=(20-g)*3;}
      if(segBlocked(fx,fy,e.x,e.y,3))sc-=40;
      if(ek==='blast'&&hyp(fx-e.x,fy-e.y)<CLS.mage.s1.rad+p.r+8)sc-=300;
      if(sc>best){best=sc;mx=dx;my=dy;}}
    if(th){const l=hyp(th.j.vx,th.j.vy),side=((p.x-th.j.x)*-th.j.vy+(p.y-th.j.y)*th.j.vx)>0?1:-1;mx+=-th.j.vy/l*side*1.5;my+=th.j.vx/l*side*1.5;}
    o.a=los&&d<C.atk.range-(MG?20:0)&&ek!=='counter';
    if(dec&&MG){
      if(p.cd[1]<=0&&d<C.s1.rad+e.r-25&&Math.random()<.85)o.s1n++;
      else if(p.cd[2]<=0&&p.hp<p.mhp*.65&&(d>200||!los)&&Math.random()<.5)o.s2n++;
    }else if(dec){
      if(p.cd[2]<=0&&d<115&&Math.random()<.8)o.s2n++;
      else if(p.cd[1]<=0&&los&&d>140&&d<C.s1.range-60&&ek!=='counter'&&Math.random()<.45)o.s1n++;
    }
  }
  const m=60;
  if(p.x<AR.x0+m)mx+=1.2*(1-(p.x-AR.x0)/m);if(p.x>AR.x1-m)mx-=1.2*(1-(AR.x1-p.x)/m);
  if(p.y<AR.y0+m)my+=1.2*(1-(p.y-AR.y0)/m);if(p.y>AR.y1-m)my-=1.2*(1-(AR.y1-p.y)/m);
  let l=hyp(mx,my)||1;mx/=l;my/=l;
  for(const q of PILLARS){const dx=q.x-p.x,dy=q.y-p.y,dd=hyp(dx,dy)||1;if(dd-q.r-p.r<35&&(mx*dx+my*dy)/dd>.3){let tx=-dy/dd,ty=dx/dd;if(tx*mx+ty*my<0){tx=-tx;ty=-ty;}mx+=tx*1.2;my+=ty*1.2;}}
  l=hyp(mx,my)||1;o.mx=mx/l;o.my=my/l;return o;
}

let FXL=[],PARTS=[],TEXTS=[],banner=null,shake=0;const MAXP=140,MAXT=20,MAXF=40;
function colOf(o){return o===myIdx?ME:ENATK;}
function bodyCol(i){if(i===myIdx)return ME;let n=0;for(let k=0;k<i;k++)if(k!==myIdx)n++;return EN[n%EN.length];}

    case 'spark':burst(e.x,e.y,colOf(e.o),4,120);break;

const r1=v=>Math.round(v*10)/10;

  J:S.J.map(j=>[j.id,j.k,j.o,r1(j.x),r1(j.y),Math.round(j.vx),Math.round(j.vy)]),
  T:S.T.map(t=>[t.id,t.o,r1(t.x),r1(t.y),t.arm>0?1:0]),fx:netFx.splice(0)};}
function snapPlayer(a,b,f,i,L){

  const act=D[4]?{k:D[4],t:D[5],a:D[6]!==0?lerpA(A[6],B[6],f):D[2],dx:D[7]?D[7][0]:0,dy:D[7]?D[7][1]:0}:null;
  return{i,cls:gcls[i],r:CLS[gcls[i]].r,x:A[0]+(B[0]-A[0])*f,y:A[1]+(B[1]-A[1])*f,face:lerpA(A[2],B[2],f),hp:D[3],mhp:CLS[gcls[i]].hp,act,root:D[8],cd:[Lp[9],Lp[10],Lp[11]],fl:D[12],alive:!!D[13]};

function buildView(now){
  if(!snaps.length)return lastView;
  const tgt=now-clockOff-INTERP;
  let ai=0;for(let k=snaps.length-1;k>=0;k--)if(snaps[k].ht<=tgt){ai=k;break;}
  const a=snaps[ai],b=snaps[ai+1]||null,L=snaps[snaps.length-1];
  const f=b?clamp((tgt-a.ht)/(b.ht-a.ht),0,1):0;
  for(const s of snaps)if(!s.played&&s.ht<=tgt){s.played=true;for(const e of s.fx)playFx(e);}
  const src=b&&f>=.5?b:a,dt=b?(b.ht-a.ht)/1000:0;
  const J=[];
  for(const q of (b||a).J){const p=b?a.J.find(x=>x[0]===q[0]):null;let x=q[3],y=q[4];if(b){if(p){x=p[3]+(q[3]-p[3])*f;y=p[4]+(q[4]-p[4])*f;}else{if(f<.5)continue;x=q[3]-q[5]*dt*(1-f);y=q[4]-q[6]*dt*(1-f);}}J.push({id:q[0],k:q[1],o:q[2],x,y,vx:q[5],vy:q[6],r:q[1]==='arrow'?4:q[1]==='big'?13:q[1]==='fire'?7:20});}
  const V={ph:L.ph,ct:L.ct,rd:src.rd,time:src.tm,wins:L.w,winner:L.win,P:a.P.map((_,i)=>snapPlayer(a,b,f,i,L)),J,T:src.T.map(t=>({id:t[0],o:t[1],x:t[2],y:t[3],arm:t[4]?1:0}))};
  while(snaps.length>2&&snaps[1].ht<tgt-500&&snaps[0].played)snaps.shift();
  lastView=V;return V;
}

$('bRe').onclick=()=>{if(mode==='bot'||!net.role){goSelect('bot');return;}myRm=true;$('bRe').disabled=true;send({t:'rm'});setMsg('mOver',oppRm?'곧 시작해요…':'상대의 동의를 기다리는 중…');hostRematchCheck();};
$('bLeave').onclick=()=>leaveToLobby();
function hostRematchCheck(){if(net.role==='host'&&myRm&&oppRm){send({t:'toSel'});goSelect('online');}}

let last=performance.now(),acc=0,lastSnap=0,lastIn=0;const QA={n:0,sum:0};
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
  let V=null;
  if(S&&(mode==='bot'||mode==='host')){
    acc+=dt;let n=0;
    while(acc>=STEP&&n<8){const inp=[];inp[myIdx]=localInput();if(mode==='bot')inp[1]=botThink(S,1,brains[1],STEP);else inp[1]=remoteIn;step(S,inp,STEP);drainFx();acc-=STEP;n++;}
    if(n>=8)acc=0;
    if(mode==='host'&&conn&&conn.open&&now-lastSnap>=SNAP_MS-4){lastSnap=now;send(makeSnap());}
    V=S;
  }else if(mode==='guest'){
    if(conn&&conn.open&&now-lastIn>=IN_MS-4){lastIn=now;const n=localInput();send({t:'in',mx:Math.round(n.mx*100)/100,my:Math.round(n.my*100)/100,a:n.a,s1n:n.s1n,s2n:n.s2n});}
    V=buildView(now);
  }
  updFx(dt);
  if(screenId==='lobby'||screenId==='room'||screenId==='select'){if(!idleDrawn){render(null,now);idleDrawn=true;}}
  else{idleDrawn=false;render(V,now);
    // 적응형 화질: 최근 120프레임 평균 간격이 24ms를 넘으면 해상도 배율을 한 단계 낮춤(2 → 1.5 → 1)
    if(dt<.07&&!document.hidden){QA.n++;QA.sum+=dt;}if(QA.n>=120){if(QA.sum/QA.n>.024&&QCAP>1&&(devicePixelRatio||1)>1){QCAP=QCAP>1.5?1.5:1;fit();}QA.n=0;QA.sum=0;}}
  if(V&&V.ph==='over'&&!overShown&&screenId==='game')showOver(V);
}

// ===== 네트워크 (PeerJS) =====
let peer=null,conn=null,net={role:null},hb=null,lastRecv=0,rtt=0;
function send(m){try{if(conn&&conn.open)conn.send(m);}catch(e){}}
function genCode(){let s='';for(let k=0;k<4;k++)s+=ALPH[Math.random()*ALPH.length|0];return s;}
function errMsg(err){const t=err&&err.type;
  if(t==='peer-unavailable')return'방을 찾을 수 없어요. 코드를 확인하세요.';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')return'방 서버(브로커)에 연결할 수 없어요. 인터넷 연결을 확인하세요.';
  if(t==='browser-incompatible')return'이 브라우저는 WebRTC를 지원하지 않아요.';
  if(t==='webrtc')return'직접 연결(WebRTC)에 실패했어요. 다른 네트워크로 시도해보세요.';
  return'연결 오류: '+(t||'알 수 없음');}
function cleanupNet(delay){clearInterval(hb);hb=null;if(net.to)clearTimeout(net.to);const c=conn,p=peer;conn=null;peer=null;net={role:null};rtt=0;const kill=()=>{try{c&&c.close();}catch(e){}try{p&&p.destroy();}catch(e){}};if(delay)setTimeout(kill,delay);else kill();}
function netFail(msg){cleanupNet();mode=null;S=null;show('lobby');setMsg('mLobby',msg);lobbyBusy(false);}
function leaveToLobby(){send({t:'bye'});cleanupNet(300);mode=null;S=null;show('lobby');setMsg('mLobby','');lobbyBusy(false);}
function lobbyBusy(b){$('bCreate').disabled=b;$('bJoin').disabled=b;$('bBot').disabled=b;}
function startHB(){clearInterval(hb);lastRecv=performance.now();hb=setInterval(()=>{if(!conn)return;send({t:'ping',ts:performance.now()});if(performance.now()-lastRecv>7000)netFail('상대의 응답이 없어 연결을 종료했어요.');},1000);}
function setupConn(c){
  c.on('open',()=>{if(conn!==c)return;lastRecv=performance.now();if(net.role==='guest')c.send({t:'hello',v:1});startHB();});
  c.on('data',d=>{if(conn===c)onData(d);});
  c.on('close',()=>{if(conn===c)netFail('상대와의 연결이 끊겼어요.');});
  c.on('error',()=>{if(conn===c)netFail('연결 오류가 발생했어요.');});
}
function createRoom(tries){
  tries=tries||0;cleanupNet();setMsg('mLobby','');
  if(typeof Peer==='undefined'){setMsg('mLobby','PeerJS를 불러오지 못했어요. 인터넷 연결을 확인하세요.');return;}
  const code=genCode(),my={role:'host',code};net=my;
  show('room');$('tCode').textContent=code;setMsg('mRoom','방 만드는 중…');$('tLink').textContent='';
  peer=new Peer(PREFIX+code,{debug:0,config:ICE});
  my.to=setTimeout(()=>{if(net===my&&!my.open)netFail('방 서버(브로커) 연결 시간 초과. 네트워크를 확인하세요.');},12000);
  peer.on('open',()=>{if(net!==my)return;my.open=true;clearTimeout(my.to);setMsg('mRoom','상대를 기다리는 중… 코드를 알려주거나 링크를 보내세요');$('tLink').textContent=inviteLink(code);});
  peer.on('connection',c=>{if(net!==my)return;if(conn){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),500);});return;}conn=c;setMsg('mRoom','상대가 들어오는 중…');setupConn(c);});
  peer.on('error',err=>{if(net!==my)return;if(err.type==='unavailable-id'){if(tries<4){createRoom(tries+1);return;}netFail('방 코드가 이미 사용 중이에요. 다시 시도하세요.');return;}
    if(err.type==='peer-unavailable')return;if(!conn||!conn.open)netFail(errMsg(err));});
  peer.on('disconnected',()=>{if(net===my&&peer&&!peer.destroyed&&!conn)try{peer.reconnect();}catch(e){}});
}
function inviteLink(code){return location.origin+location.pathname+'?room='+code;}
function joinRoom(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==4||[...code].some(ch=>!ALPH.includes(ch))){setMsg('mLobby','방 코드 4자리를 확인하세요.');return;}
  if(typeof Peer==='undefined'){setMsg('mLobby','PeerJS를 불러오지 못했어요. 인터넷 연결을 확인하세요.');return;}
  cleanupNet();const my={role:'guest',code};net=my;lobbyBusy(true);setMsg('mLobby','연결 중… ('+code+')');
  peer=new Peer({debug:0,config:ICE});
  my.to=setTimeout(()=>{if(net===my&&!my.ok)netFail(my.open?'연결 시간 초과: 방장과 직접 연결하지 못했어요. (방이 닫혔거나 네트워크/NAT 제한) 다른 Wi-Fi·LTE로 다시 시도해보세요.':'방 서버(브로커) 연결 시간 초과. 인터넷 연결을 확인하세요.');},15000);
  peer.on('open',()=>{if(net!==my)return;my.open=true;conn=peer.connect(PREFIX+code,{serialization:'json',reliable:true});setupConn(conn);});
  peer.on('error',err=>{if(net!==my)return;if(!my.ok||err.type==='peer-unavailable')netFail(errMsg(err));});
}
function onData(d){
  lastRecv=performance.now();if(!d||typeof d!=='object')return;
  switch(d.t){
    case 'hello':if(net.role!=='host')return;net.ok=true;send({t:'welcome',v:1});sel.opp=null;goSelect('online');break;
    case 'welcome':net.ok=true;clearTimeout(net.to);lobbyBusy(false);sel.opp=null;goSelect('online');break;
    case 'full':netFail('방이 가득 찼어요.');break;
    case 'pick':sel.opp=CLS[d.c]?d.c:'warrior';sel.oppReady=!!d.r;if(screenId==='select')renderSel();hostMaybeStart();break;
    case 'start':if(net.role==='guest'&&Array.isArray(d.cls))startGuest(d.cls);break;
    case 'in':if(net.role==='host')remoteIn={mx:clamp(+d.mx||0,-1,1),my:clamp(+d.my||0,-1,1),a:!!d.a,s1n:d.s1n|0,s2n:d.s2n|0};break;
    case 's':if(mode==='guest'){const now=performance.now(),off=now-d.ht;clockOff=clockOff==null||off<clockOff?off:clockOff+(off-clockOff)*.02;snaps.push(d);}break;
    case 'rm':oppRm=true;if(screenId==='over')setMsg('mOver',myRm?'곧 시작해요…':'상대가 재대결을 원해요!');hostRematchCheck();break;
    case 'toSel':if(net.role==='guest')goSelect('online');break;
    case 'ping':send({t:'pong',ts:d.ts});break;
    case 'pong':{const r=performance.now()-d.ts;rtt=rtt?rtt*.7+r*.3:r;}break;
    case 'bye':netFail('상대가 나갔어요.');break;
  }
}
function sendPick(){send({t:'pick',c:sel.my,r:sel.ready});}
function hostMaybeStart(){if(net.role==='host'&&screenId==='select'&&sel.ready&&sel.oppReady&&sel.opp){const cls=[sel.my,sel.opp];send({t:'start',cls});startHost(cls);}}

// ===== 로비 =====
$('bCreate').onclick=()=>createRoom(0);
$('bJoin').onclick=()=>joinRoom($('iCode').value);
$('bBot').onclick=()=>{setMsg('mLobby','');goSelect('bot');};
$('bCancel').onclick=()=>leaveToLobby();
$('iCode').addEventListener('input',e=>{const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(v!==e.target.value)e.target.value=v;});
$('iCode').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom(e.target.value);});
$('bCopy').onclick=async()=>{const link=inviteLink(net.code||'');let ok=false;try{await navigator.clipboard.writeText(link);ok=true;}catch(e){try{const t=document.createElement('textarea');t.value=link;document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove();}catch(e2){}}setMsg('mRoom',ok?'초대 링크를 복사했어요!':'복사 실패 — 아래 링크를 직접 공유하세요');};
(function(){const r=new URLSearchParams(location.search).get('room');if(r){const v=r.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);$('iCode').value=v;setMsg('mLobby','초대 코드 '+v+' 입력됨 — \'참가\'를 누르세요');}})();
addEventListener('beforeunload',()=>{send({t:'bye'});});
fit();requestAnimationFrame(frame);
</script>
